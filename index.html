<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090611" />
    <title>三幕奇境 · 粒子宇宙</title>
    <link rel="stylesheet" href="./site.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>

    <div id="welcome" class="welcome">
      <div class="welcome-orbit" aria-hidden="true"><span></span></div>
      <p class="eyebrow">THREE LITTLE WONDERS</p>
      <h1>三幕奇境</h1>
      <p>轻触屏幕，向上滑动<br />穿过心动、冬日与银河</p>
      <button id="enterButton" class="enter-button" type="button">
        <span>开启旅程</span><i aria-hidden="true">↗</i>
      </button>
    </div>

    <header class="topbar">
      <a class="brand" href="#scene-1" aria-label="返回第一幕">
        <span class="brand-mark">✦</span><span>三幕奇境</span>
      </a>
    </header>

    <div id="pages" class="pages">
      <section id="scene-1" class="scene scene-heart" aria-label="第一幕 心动轨迹">
        <canvas id="heartCanvas" role="button" tabindex="0" aria-label="点击扰动爱心粒子"></canvas>
        <div class="halo" aria-hidden="true"></div>
        <div class="scene-copy">
          <p class="chapter"><span>01</span> 心动轨迹</p>
          <h2>让光点<br />组成一颗心</h2>
          <p class="scene-note">点击爱心，光点会散开，再慢慢回到彼此身边。</p>
        </div>
        <p class="ambient-word ambient-love" aria-hidden="true">LOVE</p>
      </section>

      <section id="scene-2" class="scene scene-christmas" aria-label="第二幕 冬日来信">
        <canvas id="snowCanvas" aria-hidden="true"></canvas>
        <div class="moon" aria-hidden="true"></div>
        <div class="tree-wrap">
          <div class="tree-stage">
            <canvas id="treeCanvas" role="application" tabindex="0" aria-label="可拖拽旋转的三维圣诞树，使用拖拽或方向键旋转"></canvas>
            <div class="tree-ground" aria-hidden="true"></div>
          </div>
          <p class="interaction-hint tree-hint"><span aria-hidden="true">↔</span> 拖拽旋转圣诞树</p>
        </div>
        <div class="scene-copy">
          <p class="chapter"><span>02</span> 冬日来信</p>
          <h2>雪落时<br />灯火正温柔</h2>
          <p class="scene-note">拖动树体，从不同角度看灯火与雪落。</p>
        </div>
        <p class="ambient-word ambient-winter" aria-hidden="true">WINTER</p>
      </section>

      <section id="scene-3" class="scene scene-galaxy" aria-label="第三幕 银河漫游">
        <canvas id="galaxyCanvas" role="button" tabindex="0" aria-label="点击发光星点发射彩色流星"></canvas>
        <div class="planet" aria-hidden="true"><span></span></div>
        <div class="scene-copy">
          <p class="chapter"><span>03</span> 银河漫游</p>
          <h2>奔赴星斗<br />也奔赴自由</h2>
          <p class="scene-note">点击彩色光点，让不同颜色的流星划过银河。</p>
        </div>
        <p class="ambient-word ambient-galaxy" aria-hidden="true">GALAXY</p>
      </section>
    </div>

    <aside class="page-dots" aria-label="页面导航">
      <button class="page-dot active" data-page="0" type="button" aria-label="前往第一幕"><span>01</span></button>
      <button class="page-dot" data-page="1" type="button" aria-label="前往第二幕"><span>02</span></button>
      <button class="page-dot" data-page="2" type="button" aria-label="前往第三幕"><span>03</span></button>
    </aside>

    <button id="nextButton" class="next-button" type="button" aria-label="前往下一幕">
      <span class="next-label">下一幕</span>
      <span class="next-arrow" aria-hidden="true">↓</span>
    </button>

    <div class="swipe-hint" aria-hidden="true"><span></span>向上滑动</div>

    <script src="./site.js?v=8"></script>
  </body>
</html>
